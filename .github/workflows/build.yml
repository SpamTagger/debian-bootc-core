---
name: Build container image
run-name: Build debian-bootc-core by @${{ github.actor }}

on:
  repository_dispatch:
    types:
      - build

  pull_request:
    branches:
      - main

  schedule:
    - cron: "06 00 * * 6" # 0600 UTC Saturday

  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"

  workflow_dispatch:

env:
  IMAGE_DESC: "Minimal Debian-Based Bootc Image"
  IMAGE_KEYWORDS: "bootc,debian"
  IMAGE_LOGO_URL: "https://raw.githubusercontent.com/SpamTagger/SpamTagger-Bootc/refs/heads/main/spamtagger-bootc.svg" # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "${{ github.event.repository.name }}" # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/spamtagger" # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:

  # Pre-Build, single threaded
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-24.04

    outputs:
      datestamp: ${{ steps.metadata.outputs.datestamp }}

    container:
      image: "ghcr.io/ublue-os/devcontainer:latest"
      options: >
        --privileged
        --volume /var/lib/containers:/var/lib/containers
        --security-opt seccomp=unconfined
        --security-opt label=disable
        --user 0:0

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5

      - name: Generate build metadata
        id: metadata
        shell: bash
        run: |
          echo "datestamp=$(just gen-date)" >> "$GITHUB_OUTPUT"

  # Build, threaded for different versions
  build_push:
    name: Build and push ${{ matrix.version }}/${{ matrix.arch }} image

    needs:
      - prepare

    env:
      DATESTAMP: ${{ needs.prepare.outputs.datestamp }}

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:
          - version: stable
            arch: amd64
          - version: stable
            arch: arm64
          - version: testing
            arch: amd64
          - version: testing
            arch: arm64

    container:
      image: "ghcr.io/ublue-os/devcontainer:latest"
      options: >
        --privileged
        --volume /var/lib/containers:/var/lib/containers
        --security-opt seccomp=unconfined
        --security-opt label=disable
        --user 0:0

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5
        with:
          submodules: recursive

      - name: Mark Directory as Safe
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Enable architecture emulation
        run: |
          podman run --privileged --rm docker.io/tonistiigi/binfmt --install "${{ matrix.arch }}"

      - name: Build Image
        run: just build
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          DEBIAN_VER: ${{ matrix.version }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          just login-to-ghcr
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Push ${{ matrix.version }}/${{ matrix.arch }} image
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          just push-to-registry
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          DEBIAN_VER: ${{ matrix.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # Post-build actions, single thread
  manifests:
    name: Create multiarch manifests

    needs:
      - prepare
      - build_push

    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    env:
      DATESTAMP: ${{ needs.prepare.outputs.datestamp }}

    permissions:
      contents: read
      packages: write
      id-token: write

    runs-on: ubuntu-24.04

    container:
      image: "ghcr.io/ublue-os/devcontainer:latest"
      options: >
        --privileged
        --volume /var/lib/containers:/var/lib/containers
        --security-opt seccomp=unconfined
        --security-opt label=disable
        --user 0:0

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5

      - name: Mark Directory as Safe
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          just login-to-ghcr
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Build and Push Manifests
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}"

          for VERSION in stable testing; do

            echo "Generating tags for ${VERSION}"

            while IFS= read -r TAG; do
              echo "Creating manifest ${IMAGE}:${TAG}"

              podman manifest rm "${IMAGE}:${TAG}" 2>/dev/null || true

              podman manifest create "${IMAGE}:${TAG}"

              for ARCH in amd64 arm64; do
                podman manifest add \
                  "${IMAGE}:${TAG}" \
                  "docker://${IMAGE}:${TAG}-${ARCH}"
              done

              podman manifest push \
                --all \
                "${IMAGE}:${TAG}" \
                "docker://${IMAGE}:${TAG}"
            done < <(
              just gen-tags
            )
          done

      - name: Sign manifests
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}"

          for VERSION in stable testing; do

            while IFS= read -r TAG; do
              DIGEST=$(
                skopeo inspect \
                  "docker://${IMAGE}:${TAG}" \
                  | jq -r '.Digest'
              )

              cosign sign \
                --yes \
                --key env://COSIGN_PRIVATE_KEY \
                --registry-username "$GITHUB_ACTOR" \
                --registry-password "$GHCR_TOKEN" \
                "${IMAGE}@${DIGEST}"
            done < <(
              DEBIAN_VER="$VERSION" \
              just gen-tags
            )
          done
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Kickoff SpamTagger-Bootc
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: SpamTagger/Spamtagger-Bootc
          event-type: build
